services:
  api:
    container_name: messenger-api
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - seaweedfs
    build:
      context: ./backend
      dockerfile: ./build/package/api.Dockerfile
      target: build-release-stage
    networks:
      - mynet
    ports:
      - 3000:3000
    deploy:
      restart_policy:
        condition: on-failure
  postgres:
    container_name: messenger-postgres
    image: postgres:18.4
    restart: always
    shm_size: 128mb
    volumes:
      - postgres:/var/lib/postgresql
      - ./backend/db/seeds:/etc/db/seeds
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "app"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  redis:
    container_name: messenger-redis
    image: redis:8.10.1
    restart: always
    shm_size: 128mb
    ports:
      - "6379:6379"
    networks:
      - mynet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    container_name: messenger-rabbitmq
    image: rabbitmq:4.3.6-management
    hostname: main
    restart: always
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: secret
    networks:
      - mynet
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  seaweedfs:
    container_name: messenger-seaweedfs
    image: chrislusf/seaweedfs
    ports:
      - "8333:8333"
      - "8888:8888"
    environment:
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: app
    volumes:
      - seaweed_data:/data

  s3-init:
    container_name: messenger-s3-init
    image: amazon/aws-cli:2.40.3
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: app
      AWS_SECRET_ACCESS_KEY: secret
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./backend/deploy/object_storage:/scripts:ro
    depends_on:
      - seaweedfs

volumes:
  postgres:
  seaweed_data:

networks:
  mynet:
    driver: bridge
