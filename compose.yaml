services:
  postgres:
    image: postgres:18.4
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    networks:
      - mynet

volumes:
  postgres:

networks:
  mynet:
    driver: bridge
