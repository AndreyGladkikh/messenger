services:
  app:
    depends_on:
      - postgres
    build:
      context: ./
      dockerfile: ./docker/app/Dockerfile
    networks:
      - mynet
    ports:
      - 50051:50051
    deploy:
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16.3
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    networks:
      - mynet

volumes:
  postgres:

networks:
  mynet:
    driver: bridge
