asyncapi: 3.0.0
info:
  title: Chatique WebSocket API
  version: 0.1.1
  description: |-
    The Smartylighting Streetlights API allows you to remotely manage the city
    lights.
    ### Check out its awesome features:

    * Turn a specific streetlight on/off 🌃  
    * Dim a specific streetlight 😎
    * Receive real-time information about environmental lighting conditions 📈
defaultContentType: application/json
servers:
  production:
    host: chatique.ru
    pathname: /ws
    protocol: wss
channels:
  root:
    address: /
    messages:
      typingStarted:
        $ref: '#/components/messages/typingStarted'
      typingStopped:
        $ref: '#/components/messages/typingStopped'
      directConversationStarted:
        $ref: '#/components/messages/directConversationStarted'
      messageSent:
        $ref: '#/components/messages/messageSent'
operations:
  receiveTypingStarted:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/typingStarted'
  sendTypingStarted:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/typingStarted'
  receiveTypingStopped:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/typingStopped'
  sendTypingStopped:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/typingStopped'
  sendDirectConversationStarted:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/directConversationStarted'
  sendMessageSent:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/messageSent'
components:
  messages:
    typingStarted:
      name: typingStarted
      title: Typing Started
      payload:
        $ref: '#/components/schemas/typingStartedPayload'
    typingStopped:
      name: typingStopped
      title: Typing Stopped
      payload:
        $ref: '#/components/schemas/typingStoppedPayload'
    directConversationStarted:
      name: directConversationStarted
      title: Direct conversation started
      payload:
        $ref: '#/components/schemas/directConversationStartedPayload'
    messageSent:
      name: messageSent
      title: Message Sent
      payload:
        $ref: '#/components/schemas/messageSentPayload'
  schemas:
    # baseMessage:
    #   type: object
    #   properties:
    #     id:
    #       type: string
    #     type:
    #       type: string
    #     data:
    #       type: object
    typingStartedPayload:
      type: object
      required:
        - typingId
        - typingDisplayName
      properties:
        typingId:
          type: string
          format: uuid
        typingDisplayName:
          type: string
    typingStoppedPayload:
      type: object
      required:
        - typingId
      properties:
        typingId:
          type: string
          format: uuid
    directConversationStartedPayload:
      type: object
      required:
        - conversationId
        - senderId
        - senderDisplayName
        - avatarUrl
        - message
      properties:
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        senderDisplayName:
          type: string
        avatarUrl:
          type: string
        message:
          $ref: '#/components/schemas/messagePayload'
    messagePayload:
      type: object
      required:
        - body
        - sentAt
      properties:
        body:
          type: string
        sentAt:
          $ref: '#/components/schemas/sentAt'
    messageSentPayload:
      allOf:
        - $ref: '#/components/schemas/messagePayload'
        - type: object
          required:
            - conversationId
          properties:
            conversationId:
              type: string
              format: uuid
            replyToMessageId:
              type: string
              format: uuid
    sentAt:
      type: string
      format: date-time
      description: Date and time when the message was sent.
  securitySchemes:
    saslScram:
      type: scramSha256
      description: Provide your username and password for SASL/SCRAM authentication
    certs:
      type: X509
      description: Download the certificate files from service provider
  parameters:
    streetlightId:
      description: The ID of the streetlight.
  messageTraits:
    commonHeaders:
      headers:
        type: object
        properties:
          my-app-header:
            type: integer
            minimum: 0
            maximum: 100
  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId:
            type: string
            enum:
              - my-app-id
