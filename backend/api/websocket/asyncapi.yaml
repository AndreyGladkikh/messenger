asyncapi: 3.0.0
info:
  title: Chatique WebSocket API
  version: 0.1.1
  description: |-
    The Smartylighting Streetlights API allows you to remotely manage the city
    lights.
    ### Check out its awesome features:

    * Turn a specific streetlight on/off 🌃  
    * Dim a specific streetlight 😎
    * Receive real-time information about environmental lighting conditions 📈
defaultContentType: application/json
servers:
  production:
    host: chatique.ru
    pathname: /ws
    protocol: wss
channels:
  root:
    address: /
    messages:
      sendMessage:
        $ref: '#/components/messages/sendMessage'
      sendFirstDirectMessage:
        $ref: '#/components/messages/sendFirstDirectMessage'
      messageSent:
        $ref: '#/components/messages/messageSent'
operations:
  receiveSendMessage:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/sendMessage'
  receiveSendFirstDirectMessage:
    action: receive
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/sendFirstDirectMessage'
  sendMessageSent:
    action: send
    channel:
      $ref: '#/channels/root'
    messages:
      - $ref: '#/channels/root/messages/messageSent'
components:
  messages:
    sendMessage:
      name: sendMessage
      title: Send Message
      payload:
        $ref: '#/components/schemas/sendMessagePayload'
    sendFirstDirectMessage:
      name: sendFirstDirectMessage
      title: Send First Direct Message
      payload:
        $ref: '#/components/schemas/sendFirstDirectMessagePayload'
    messageSent:
      name: messageSent
      title: Message Sent
      payload:
        $ref: '#/components/schemas/messageSentPayload'
  schemas:
    baseMessage:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
    sendMessagePayload:
      allOf:
        - $ref: '#/components/schemas/baseMessage'
        - type: object
          properties:
            data:
              type: object
              properties:
                body:
                  type: string
                chatId:
                  type: string
                  format: uuid
                replyToMessageId:
                  type: string
                  format: uuid
    sendFirstDirectMessagePayload:
      allOf:
        - $ref: '#/components/schemas/baseMessage'
        - type: object
          properties:
            data:
              type: object
              properties:
                body:
                  type: string
                sender:
                  type: string
                  format: uuid
                recipient:
                  type: string
                  format: uuid
    messageSentPayload:
      allOf:
        - $ref: '#/components/schemas/baseMessage'
        - type: object
          properties:
            data:
              type: object
              properties:
                body:
                  type: string
                chatId:
                  type: string
                  format: uuid
                replyToMessageId:
                  type: string
                  format: uuid
    sentAt:
      type: string
      format: date-time
      description: Date and time when the message was sent.
  securitySchemes:
    saslScram:
      type: scramSha256
      description: Provide your username and password for SASL/SCRAM authentication
    certs:
      type: X509
      description: Download the certificate files from service provider
  parameters:
    streetlightId:
      description: The ID of the streetlight.
  messageTraits:
    commonHeaders:
      headers:
        type: object
        properties:
          my-app-header:
            type: integer
            minimum: 0
            maximum: 100
  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId:
            type: string
            enum:
              - my-app-id
