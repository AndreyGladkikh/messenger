openapi: 3.1.0
info:
  title: Chatique - OpenAPI 3.1
  description: |-
    Chatique (pronounced "chatik", or "cha-TEEK", with the stress on the last syllable, French-style) is a messaging platform featuring message and file sharing, reactions, comments, and bot creation.

  contact:
    email: andrgladkikh@gmail.com
  version: 1.0.0
servers:
  - url: https://chatique.ru/api/v1
tags:
  - name: auth
    description: Everything about identity and access
  - name: me
    description: Current user info
paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user.
      description: Register a new user.
      operationId: registerUser
      requestBody:
        description: Create a new user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Invalid input
        '422':
          description: Domain error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      tags:
        - auth
      summary: Log in.
      description: Log in.
      operationId: loginUser
      requestBody:
        description: log in
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Invalid input
        '422':
          description: Domain error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/refresh:
    post:
      parameters:
        - name: refresh_token
          in: cookie
          description: Token required to refresh access and refresh token pair
          required: true
          schema:
            type: string
      tags:
        - auth
      summary: Refresh access tokens.
      description: Refresh access tokens.
      operationId: refreshTokens
      requestBody:
        description: refresh tokens
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          description: Invalid input
        '422':
          description: Domain error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      tags:
        - auth
      summary: Get current user info.
      description: Get current user info.
      operationId: getMe
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
        '400':
          description: Invalid input
        '422':
          description: Domain error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerHttpAuthentication: []
  /me/chats:
    get:
      tags:
        - me
      summary: Get current user chat list.
      description: Get current chat list for main page.
      operationId: getCurrentUserChatList
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        unreadCount:
                          type: integer
                        lastMessage:
                          type: object
                          properties:
                            body:
                              type: string
                            sentAt:
                              type: string
        '400':
          description: Invalid input
        '422':
          description: Domain error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerHttpAuthentication: []
components:
  schemas:
    Credentials:
      required:
        - login
        - password
      type: object
      properties:
        login:
          type: string
        password:
          type: string
    Tokens:
      required:
        - accessToken
        - refreshToken
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - code
        - message
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            "write:pets": modify pets in your account
            "read:pets": read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
    bearerHttpAuthentication:
      description: Bearer token using a JWT
      type: http
      scheme: Bearer
      bearerFormat: JWT